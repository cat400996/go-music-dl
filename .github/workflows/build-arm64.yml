name: Build AArch64 Only Docker Image
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKER_IMAGE: 400996/go-music-dl
  IMAGE_TAG: latest
  TZ: Asia/Shanghai

jobs:
  build_arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup QEMU for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 构建arm64镜像载入本地，tag固定latest
      - name: Build arm64 image local
        run: |
          set -ex
          docker buildx build \
            --platform linux/arm64 \
            --load \
            -t ${DOCKER_IMAGE}:${{ env.IMAGE_TAG }} \
            --build-arg BUILD_TARGET=arm64 \
            .

      # 登录DockerHub
      - name: Login to DockerHub
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PWD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "${DOCKER_PWD}" | docker login -u "${DOCKER_USER}" --password-stdin

      # 推送 latest 标签镜像
      - name: Push docker image
        run: docker push ${DOCKER_IMAGE}:${{ env.IMAGE_TAG }}
