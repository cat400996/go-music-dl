name: Build Arm64 Only
on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  DOCKER_IMAGE: 400996/go-music-dl
  IMAGE_TAG: latest
  TZ: Asia/Shanghai

jobs:
  build_arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # =====新增：构建镜像前自动删除 sakana-widget 子模块=====
      - name: Remove sakana-widget submodule before build
        run: |
          # 反初始化子模块
          git submodule deinit -f sakana-widget || true
          # 删除文件夹
          rm -rf sakana-widget
          # 删除git子模块缓存
          rm -rf .git/modules/sakana-widget
          # 清除.gitmodules配置
          git config -f .gitmodules --remove-section submodule.sakana-widget || true
          # 仅在构建机器删除，不提交回远程仓库（不改动GitHub源码）
      # =====================================================

      - name: Setup QEMU Arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Init Buildx
        uses: docker/setup-buildx-action@v3

      - name: DockerHub Login
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PWD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "${DOCKER_PWD}" | docker login -u "${DOCKER_USER}" --password-stdin

      - name: Build & Load Local Arm64 Image
        run: |
          set -ex
          docker buildx build \
            --platform linux/arm64 \
            --load \
            -t ${DOCKER_IMAGE}:${IMAGE_TAG} \
            --build-arg BUILD_TARGET=arm64 \
            .

      - name: Push Clean Image
        run: docker push ${DOCKER_IMAGE}:${IMAGE_TAG}
