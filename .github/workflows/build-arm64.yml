name: Build Arm64 Only
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  IMAGE_NAME: cat400996/go-music-dl

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install QEMU arm64 cross compile
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Init Buildx builder
        uses: docker/setup-buildx-action@v3

      - name: DockerHub Login
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PWD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "${DOCKER_PWD}" | docker login -u "${DOCKER_USER}" --password-stdin

      - name: Generate git commit tag
        run: echo "TAG=sha-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build & Push arm64 image
        run: |
          set -x
          docker buildx build \
            --platform linux/arm64 \
            --push \
            -t ${IMAGE_NAME}:${TAG} \
            --build-arg BUILD_TARGET=arm64 \
            .
