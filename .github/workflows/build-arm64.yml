name: Build Arm64 Only
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  IMAGE: cat400996/go-music-dl

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: QEMU Arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Buildx Init
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          P: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$P" | docker login -u "$U" --password-stdin

      - name: Get SHA Tag
        run: echo "TAG=sha-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Push
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --push \
            -t ${IMAGE}:${TAG} \
            --build-arg BUILD_TARGET=arm64 \
            .
