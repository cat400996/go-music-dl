name: Build Arm64 Only
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  IMAGE_NAME: cat400996/go-music-dl

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: QEMU Arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Buildx Init
        uses: docker/setup-buildx-action@v3

      # 标准DockerHub登录，无多余参数
      - name: Docker Login
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PWD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "${DOCKER_PWD}" | docker login -u "${DOCKER_USER}" --password-stdin

      # 生成标签
      - name: Get Git SHA Tag
        run: echo "TAG=sha-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # 纯arm64构建推送，移除所有缓存、provenance、sbom等额外参数
      - name: Build Push
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --push \
            -t ${IMAGE_NAME}:${TAG} \
            --build-arg BUILD_TARGET=arm64 \
            .
