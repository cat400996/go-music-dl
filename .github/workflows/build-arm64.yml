name: Build AArch64 Docker Push DockerHub
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  DOCKER_HUB_USER: 400996
  DOCKER_HUB_REPO: go-music-dl
  DOCKER_PLATFORM: linux/arm64

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        run: |
          TAGS="${{ env.DOCKER_HUB_USER }}/${{ env.DOCKER_HUB_REPO }}:latest"
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            TAGS+=",${{ env.DOCKER_HUB_USER }}/${{ env.DOCKER_HUB_REPO }}:v$VERSION"
          fi
          echo "TAGS=$TAGS" >> $GITHUB_ENV

      - name: Build & Push AArch64 Only
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.DOCKER_PLATFORM }}
          push: true
          tags: ${{ env.TAGS }}
          cache-from: type=registry,ref=${{ env.DOCKER_HUB_USER }}/${{ env.DOCKER_HUB_REPO }}:latest
          cache-to: type=registry,ref=${{ env.DOCKER_HUB_USER }}/${{ env.DOCKER_HUB_REPO }}:buildcache,mode=max
