name: Build Arm64 Stable
on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  DOCKER_IMAGE: 400996/go-music-dl
  IMAGE_TAG: latest
  TZ: Asia/Shanghai

jobs:
  build_arm64:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装ARM64编译环境
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 初始化buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录DockerHub
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PWD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "${DOCKER_PWD}" | docker login -u "${DOCKER_USER}" --password-stdin

      - name: 构建纯净ARM64镜像
        run: |
          set -ex
          docker buildx build \
            --platform linux/arm64 \
            --load \
            -t ${DOCKER_IMAGE}:${IMAGE_TAG} \
            --build-arg BUILD_TARGET=arm64 \
            .

      - name: 完整推送全新镜像覆盖latest
        run: docker push ${DOCKER_IMAGE}:${IMAGE_TAG}
