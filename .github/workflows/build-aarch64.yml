name: Build AArch64 Only Docker Image
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持手动触发构建

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_REPO: cat400996/go-music-dl
  TZ: Asia/Shanghai

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up QEMU arm64 编译支持
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 初始化 Buildx 构建器
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: 登录 DockerHub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成 Git SHA 镜像标签
        id: meta
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "IMAGE_TAG=sha-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: 仅构建并推送 linux/arm64 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          # 仅单架构 aarch64，杜绝多架构分层冲突
          platforms: linux/arm64
          push: true
          tags: ${{ env.DOCKER_REPO }}:${{ env.IMAGE_TAG }}
          # 独立架构缓存，避免脏分层
          cache-from: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache-arm64
          cache-to: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache-arm64,mode=max
          build-args: BUILD_TARGET=arm64
          network: host
          # 关闭自动生成provenance，减少额外分层，进一步规避sha校验异常
          provenance: false
